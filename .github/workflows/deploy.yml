name: Deploy to Vercel

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    name: Deploy (Production)
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verificar secrets de Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          missing=""
          [ -z "$VERCEL_TOKEN" ] && missing="$missing VERCEL_TOKEN"
          [ -z "$VERCEL_ORG_ID" ] && missing="$missing VERCEL_ORG_ID"
          [ -z "$VERCEL_PROJECT_ID" ] && missing="$missing VERCEL_PROJECT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Faltan secrets en GitHub para desplegar a Vercel:$missing"
            exit 1
          fi
          echo "Secrets de Vercel presentes. Las env vars de runtime (Supabase) se toman de Vercel vía 'vercel pull'."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Verificar env vars de producción en Vercel
        run: |
          envfile=".vercel/.env.production.local"
          if [ ! -f "$envfile" ]; then
            echo "::error::'vercel pull' no generó $envfile. No hay env vars de Production en el proyecto de Vercel."
            exit 1
          fi
          missing=""
          for v in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY; do
            # Considera faltante si no existe la clave o si su valor está vacío.
            if ! grep -qE "^${v}=.+" "$envfile"; then
              missing="$missing $v"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Faltan env vars en Vercel (Settings → Environment Variables, entorno Production):$missing"
            echo "Las NEXT_PUBLIC_* se hornean en 'vercel build'; si faltan, el deploy levanta pero crashea con 'Your project's URL and Key are required'."
            exit 1
          fi
          echo "Env vars de Production presentes en Vercel. OK para buildear."

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
