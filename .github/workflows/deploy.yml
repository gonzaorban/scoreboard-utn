name: Deploy to Vercel

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    name: Deploy (Production)
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    env:
      # Config del proyecto y env vars de runtime: TODO sale de los secrets de
      # GitHub. No usamos 'vercel pull' (no podía leer variables marcadas como
      # "Sensitive" en Vercel, lo que dejaba el build sin la URL de Supabase).
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verificar secrets requeridos
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          missing=""
          [ -z "$VERCEL_TOKEN" ] && missing="$missing VERCEL_TOKEN"
          [ -z "$VERCEL_ORG_ID" ] && missing="$missing VERCEL_ORG_ID"
          [ -z "$VERCEL_PROJECT_ID" ] && missing="$missing VERCEL_PROJECT_ID"
          [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] && missing="$missing NEXT_PUBLIC_SUPABASE_URL"
          [ -z "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ] && missing="$missing NEXT_PUBLIC_SUPABASE_ANON_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Faltan secrets en GitHub (Settings → Secrets and variables → Actions):$missing"
            exit 1
          fi
          echo "Secrets requeridos presentes."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Pull Vercel project settings
        # 'vercel build' necesita los Project Settings (framework, build command).
        # Solo 'vercel pull' sabe traerlos; generar project.json a mano no alcanza.
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Sobrescribir env vars de Supabase desde secrets de GitHub
        run: |
          # 'vercel pull' no puede leer variables marcadas como "Sensitive" en
          # Vercel (p. ej. NEXT_PUBLIC_SUPABASE_URL), así que las pisamos con los
          # secrets de GitHub. Las NEXT_PUBLIC_* no son secretas (van embebidas en
          # el JS del cliente), por lo que es seguro hornearlas desde GitHub.
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}"
          } > .vercel/.env.production.local

          # Validar que quedaron con valor (defensa ante secrets vacíos).
          for v in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY; do
            if ! grep -qE "^${v}=.+" .vercel/.env.production.local; then
              echo "::error::El secret $v está vacío en GitHub (Settings → Secrets and variables → Actions)."
              exit 1
            fi
          done
          echo "Env vars de Supabase tomadas de los secrets de GitHub."

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
